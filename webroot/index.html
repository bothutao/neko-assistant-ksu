                            isAgentMode = true;

                            execSync(`settings put system pointer_location 1`);
                            startSilentAudio();
                            
                            let countdown = 3;
                            spanText.textContent = `已授权，${countdown}s后开始(请挂小窗)`;
                            btnAuth.style.pointerEvents = 'none';
                            btnAuth.style.opacity = '0.5';
                            btnReject.style.pointerEvents = 'none';
                            btnReject.style.opacity = '0.5';
                            
                            let cdInterval = setInterval(() => {
                                countdown--;
                                if (countdown > 0) {
                                    spanText.textContent = `已授权，${countdown}s后开始(请挂小窗)`;
                                } else {
                                    clearInterval(cdInterval);
                                    spanText.textContent = "开始执行...";
                                    proceedAgentTools(newMsg, currentModel, effort);
                                }
                            }, 1000);

                        }, 3000);
                    };
                    const cancelPress = () => {
                        clearTimeout(pressTimer);
                        clearInterval(progressInterval);
                        progBar.style.width = '0%';
                        spanText.textContent = "长按3秒授权接管";
                    };
                    btnAuth.addEventListener('mousedown', startPress);
                    btnAuth.addEventListener('touchstart', startPress, {passive: false});
                    btnAuth.addEventListener('mouseup', cancelPress);
                    btnAuth.addEventListener('mouseleave', cancelPress);
                    btnAuth.addEventListener('touchend', cancelPress);
                    btnAuth.addEventListener('touchcancel', cancelPress);
                }
                return;
            }

            proceedAgentTools(newMsg, currentModel, effort);
            return;
        }

        if (fullContent || fullReasoning) {
            let displayModel = currentModel === cfg.MODEL_PRO ? 'Pro' : 'Flash';
            if (effort !== 'none') displayModel += ` (${effort})`;
            
            let newMsg = { 
                id: getNextId(), role: 'assistant', content: fullContent, 
                reasoning: fullReasoning, model: displayModel, timestamp: Date.now() 
            };
            chatHistory.push(newMsg);
            await saveHistory();
            
            renderMessageWithTags(newMsg, 'bot');
            setTimeout(() => renderMermaidInDOM(chatContainer), 100);

            if (isAgentMode) {
                sendToast("🐱 思考完成，请切回 WebUI 查看结果喵～");
                execSync(`settings put system pointer_location 0`);
                isAgentMode = false;
                stopSilentAudio();
            }
        }
    }

    async function proceedAgentTools(msgObj, currentModel, effort) {
        for (let tc of msgObj.tool_calls) {
            if (currentAbortController && currentAbortController.signal.aborted) {
                if (isAgentMode) {
                    execSync(`settings put system pointer_location 0`);
                    isAgentMode = false;
                    stopSilentAudio();
                }
                break;
            }
            
            let toolMsg = chatHistory.find(m => m.role === 'tool' && m.tool_call_id === tc.id);
            if (!toolMsg) {
                toolMsg = { id: getNextId(), role: 'tool', tool_call_id: tc.id, content: "执行中...", model: 'Tool Result', timestamp: Date.now() };
                chatHistory.push(toolMsg);
                await saveHistory();
            }

            let args = JSON.parse(tc.function.arguments);
            let toolResult = "";
            let cardEl = document.getElementById(`tool-card-${tc.id}`);
            
            if (cardEl) {
                cardEl.classList.remove('danger');
            }
            
            await new Promise(r => setTimeout(r, 1000));

            if (tc.function.name === 'execute_command') {
                if (isAgentMode) {
                    if (cardEl) {
                        cardEl.classList.add('done');
                        cardEl.innerHTML = `<div>🐱 正在后台执行...</div>
                            <div class="exec-cmd">${escapeHTML(args.command)}</div>
                            <div class="exec-out" style="display:block;">等待 KSU 执行...</div>`;
                    }
                    sendToast(`🐱 执行命令: ${args.command}`);
                    execSync(`export PATH=/data/adb/ksu/bin:/system/bin:$PATH; echo '${args.command.replace(/'/g, "'\\''")}' > /data/adb/neko/neko_cmd.txt`);
                    execSync(`export PATH=/data/adb/ksu/bin:/system/bin:$PATH; sh /data/adb/modules/neko/neko_exec.sh > /dev/null 2>&1 &`);
                    await new Promise(r => setTimeout(r, 1500));
                    let allText = "";
                    let lineNum = 1;
                    while (lineNum <= 500) {
                        let line = execSync(`sed -n '${lineNum}p' /data/adb/neko/neko_res.txt`);
                        if (line.trim() === "___EOF___" || line.trim() === "___TIMEOUT___") break;
                        allText += line + "\n";
                        lineNum++;
                        if (lineNum % 50 === 0) await new Promise(r => setTimeout(r, 0));
                    }
                    toolResult = allText.trim() || "(无输出)";
                } else {
                    if (cardEl) {
                        cardEl.classList.add('done');
                        cardEl.innerHTML = `<div>🐱 正在评估命令风险...</div>
                            <div class="exec-cmd">${escapeHTML(args.command)}</div>
                            <div class="exec-out">安检中，请稍候...</div>`;
                    }
                    scrollToBottom();

                    let safety = await checkCommandSafety(args.command);
                    let isDangerous = (safety.status === 'DANGEROUS');
                    let isApproved = true;

                    if (isDangerous) {
                        if (cardEl) {
                            cardEl.classList.add('danger');
                            cardEl.innerHTML = `<div style="color:#ff8888; font-weight:bold;">⚠️ 高危命令拦截：</div>
                                <div class="exec-cmd" style="color:#ff8888; border-color:#662222;">${escapeHTML(args.command)}</div>
                                <div style="font-size:12px; color:#ff8888; margin-bottom:10px;">安检AI：${escapeHTML(safety.reason)}</div>
                                <div class="exec-actions">
                                    <button class="btn-no" id="btn-cancel-${tc.id}">取消执行</button>
                                    <button class="btn-danger-longpress" id="btn-longpress-${tc.id}">
                                        <div class="progress-bar" id="prog-${tc.id}"></div>
                                        <span>长按3秒继续执行</span>
                                    </button>
                                </div>`;
                            
                            isApproved = await new Promise((resolve) => {
                                let btnCancel = cardEl.querySelector(`#btn-cancel-${tc.id}`);
                                let btnLongPress = cardEl.querySelector(`#btn-longpress-${tc.id}`);
                                let progBar = cardEl.querySelector(`#prog-${tc.id}`);
                                let spanText = btnLongPress.querySelector('span');
                                
                                let pressTimer, progressInterval, startTime;
                                btnCancel.onclick = () => resolve(false);

                                const startPress = (e) => {
                                    e.preventDefault();
                                    startTime = Date.now();
                                    spanText.textContent = "继续按住...";
                                    progressInterval = setInterval(() => {
                                        let percent = Math.min(100, ((Date.now() - startTime) / 3000) * 100);
                                        progBar.style.width = percent + '%';
                                    }, 50);
                                    pressTimer = setTimeout(() => {
                                        clearInterval(progressInterval);
                                        progBar.style.width = '100%';
                                        spanText.textContent = "执行中...";
                                        resolve(true);
                                    }, 3000);
                                };

                                const cancelPress = () => {
                                    clearTimeout(pressTimer);
                                    clearInterval(progressInterval);
                                    progBar.style.width = '0%';
                                    spanText.textContent = "长按3秒继续执行";
                                };

                                btnLongPress.addEventListener('mousedown', startPress);
                                btnLongPress.addEventListener('touchstart', startPress, {passive: false});
                                btnLongPress.addEventListener('mouseup', cancelPress);
                                btnLongPress.addEventListener('mouseleave', cancelPress);
                                btnLongPress.addEventListener('touchend', cancelPress);
                                btnLongPress.addEventListener('touchcancel', cancelPress);
                            });
                        }
                    } else {
                        if (cardEl) {
                            cardEl.classList.remove('danger');
                            cardEl.classList.add('done');
                            cardEl.innerHTML = `<div>🐱 安检通过，正在执行...</div>
                                <div class="exec-cmd">${escapeHTML(args.command)}</div>
                                <div class="exec-out" style="display:block;">等待 KSU 执行...</div>`;
                        }
                        scrollToBottom();
                        await new Promise(r => setTimeout(r, 500));
                    }

                    if (isApproved) {
                        if (cardEl) {
                            cardEl.innerHTML = `<div>🐱 正在后台执行...</div>
                                <div class="exec-cmd">${escapeHTML(args.command)}</div>
                                <div class="exec-out" style="display:block;">等待 KSU 执行...</div>`;
                        }
                        scrollToBottom();

                        execSync(`export PATH=/data/adb/ksu/bin:/system/bin:$PATH; echo '${args.command.replace(/'/g, "'\\''")}' > /data/adb/neko/neko_cmd.txt`);
                        execSync(`export PATH=/data/adb/ksu/bin:/system/bin:$PATH; sh /data/adb/modules/neko/neko_exec.sh > /dev/null 2>&1 &`);
                        
                        let outBox = cardEl ? cardEl.querySelector('.exec-out') : null;
                        let allText = "";
                        let startTime = Date.now();
                        let finished = false;
                        
                        while (!finished) {
                            await new Promise(r => setTimeout(r, 500));
                            let currentRet = execSync(`cat /data/adb/neko/neko_res.txt 2>/dev/null`);
                            
                            if (currentRet) {
                                let displayRet = currentRet.replace(/___EOF___|___TIMEOUT___/g, '').trim();
                                if (outBox) outBox.textContent = displayRet || "等待输出...";
                                scrollToBottom();
                            }
                            
                            if (currentRet.includes('___EOF___') || currentRet.includes('___TIMEOUT___')) {
                                finished = true;
                                break;
                            }
                            
                            if (Date.now() - startTime > 20000) {
                                if (outBox) outBox.textContent = "执行超时（前端等待20秒无果）";
                                toolResult = "执行超时，未获取到结果。";
                                finished = true;
                                break;
                            }
                        }

                        if (finished && !toolResult) {
                            let lineNum = 1;
                            while (lineNum <= 500) {
                                let line = execSync(`sed -n '${lineNum}p' /data/adb/neko/neko_res.txt`);
                                if (line.trim() === "___EOF___" || line.trim() === "___TIMEOUT___") break;
                                allText += line + "\n";
                                lineNum++;
                                if (lineNum % 50 === 0) await new Promise(r => setTimeout(r, 0));
                            }
                            toolResult = allText.trim() || "(无输出)";
                            if (cardEl) {
                                cardEl.classList.remove('danger');
                                cardEl.innerHTML = `<div>🐱 系统操作记录：</div>
                                    <div class="exec-cmd">${escapeHTML(args.command)}</div>
                                    <div class="exec-out">${escapeHTML(toolResult)}</div>
                                    <div class="exec-status">✅ 执行完成</div>`;
                            }
                        }
                    } else {
                        if (cardEl) {
                            cardEl.classList.remove('danger');
                            cardEl.innerHTML = `<div>🐱 系统操作记录：</div>
                                <div class="exec-cmd">${escapeHTML(args.command)}</div>
                                <div class="exec-status">❌ 已取消执行</div>`;
                        }
                        toolResult = "用户拒绝执行此命令。";
                    }
                }
            } else {
                if (cardEl) {
                    cardEl.classList.add('done');
                    cardEl.innerHTML = `<div>🐱 正在执行...</div><div class="exec-cmd">${tc.function.name}</div><div class="exec-out">加载中...</div>`;
                }
                
                if (tc.function.name === 'read_ui') {
                    toolResult = await callAgentReadUI();
                } 
                else if (tc.function.name === 'read_ocr') {
                    toolResult = await callAgentReadOCR();
                }
                else if (tc.function.name === 'tap_screen') {
                    if (isAgentMode) sendToast(`👆 点击屏幕 (${args.x}, ${args.y})`);
                    toolResult = await callAgentAction(`input tap ${args.x} ${args.y}`);
                }
                else if (tc.function.name === 'swipe_screen') {
                    if (isAgentMode) sendToast(`👆 滑动屏幕 (${args.start_x}, ${args.start_y}) → (${args.end_x}, ${args.end_y})`);
                    toolResult = await callAgentAction(`input swipe ${args.start_x} ${args.start_y} ${args.end_x} ${args.end_y} 500`);
                }
                else if (tc.function.name === 'input_text') {
                    if (isAgentMode) sendToast(`⌨️ 输入文字: ${args.text || ""}`);
                    let txt = args.text || "";
                    let safeText = txt.replace(/'/g, "'\\''");
                    let cmd = `app_process -Djava.class.path=/data/adb/modules/neko/bin/yadb /data/adb/modules/neko/bin com.ysbing.yadb.Main -keyboard '${safeText}'`;
                    
                    try {
                        let ret = execSync(cmd);
                        if (ret && ret.trim()) {
                            toolResult = `YADB 返回信息：${ret.trim()}，已尝试输入：${txt}`;
                        } else {
                            toolResult = `已通过 YADB 输入文字：${txt}`;
                        }
                    } catch(e) {
                        toolResult = `YADB 输入失败：${e.message}`;
                    }
                }
                else if (tc.function.name === 'press_key') {
                    if (isAgentMode) sendToast(`🔘 按键: ${args.keycode}`);
                    toolResult = await callAgentAction(`input keyevent ${args.keycode}`);
                }
                else if (tc.function.name === 'view_image') {
                    if (isAgentMode) sendToast(`🖼️ 正在识图，请稍候...`);
                    toolResult = await callAgentViewImage();
                }
                else if (tc.function.name === 'notify_user') {
                    toolResult = await callAgentNotify(args.text);
                }
                else if (tc.function.name === 'search') {
                    if (isAgentMode) sendToast(`🔍 正在搜索: ${args.query}`);
                    toolResult = await callSearchAPI(args.query);
                }
                else if (tc.function.name === 'fetch_url') {
                    if (isAgentMode) sendToast(`🌐 正在抓取网页...`);
                    toolResult = await callFetchAPI(args.url);
                }
                else if (tc.function.name === 'write_memory') {
                    toolResult = await callWriteMemory(args.content);
                }
                else if (tc.function.name === 'search_memory') {
                    toolResult = await callSearchMemory(args.keyword);
                }
                else if (tc.function.name === 'delete_memory') {
                    toolResult = await callDeleteMemory(args.timestamp);
                }
            }

            if (!toolResult) toolResult = "(无输出文本)";
            toolMsg.content = toolResult;
            await saveHistory();

            if (cardEl && !cardEl.innerHTML.includes('执行完成') && !cardEl.innerHTML.includes('已取消')) {
                cardEl.innerHTML = `<div>🐱 系统自动执行：</div>
                    <div class="exec-cmd">${escapeHTML(tc.function.name)}</div>
                    <div class="exec-out">${escapeHTML(toolResult)}</div>
                    <div class="exec-status">✅ 执行完成</div>`;
            }
        }

        if (currentAbortController && currentAbortController.signal.aborted) return;

        let newCtx = getContextPayload();
        let newStreamWrapper = document.createElement('div');
        newStreamWrapper.className = 'msg-wrapper bot';
        newStreamWrapper.id = 'streaming-bubble';
        let header = buildHeader('bot', '分析执行结果', Date.now());
        if (header) newStreamWrapper.appendChild(header);
        let newDiv = document.createElement('div');
        newDiv.className = 'message bot';
        newStreamWrapper.appendChild(newDiv);
        chatContainer.appendChild(newStreamWrapper);
        scrollToBottom();

        await processStreamAndFollowUp(newCtx, currentModel, effort, newStreamWrapper, 1); 
    }

    function handleSendOrStop() {
        if (isGenerating) {
            if (currentAbortController) {
                currentAbortController.abort();
            }
            return;
        }
        sendMessage();
    }

    async function sendMessage() {
        if (isGenerating) return;
        const clickTime = Date.now();

        try {
            let text = userInput.value.trim();
            if (!text && currentAttachments.length === 0) return;

            if (!cfg.API_KEY) {
                appendMessage('error-msg', '❌ 未配置 API Key，请编辑 /data/adb/neko/config.conf 后点菜单「重载配置」');
                return;
            }

            isGenerating = true;
            currentAbortController = new AbortController();
            userInput.disabled = true;
            sendBtn.classList.add('stopping');
            sendBtn.innerText = '停止';

            isAgentMode = false;

            let hasImages = false;
            let textFileNames = [];
            let textFileContents = [];
            let highImages = [];

            if (currentAttachments.length > 0) {
                currentAttachments.forEach(att => {
                    if (att.type === 'image') {
                        hasImages = true;
                        highImages.push(att.high);
                    } else if (att.type === 'text') {
                        textFileNames.push(att.name);
                        textFileContents.push(att.content);
                    }
                });
            }

            let currentModel = cfg.MODEL_FLASH;
            let effort = flashEffort;

            if (hasImages) {
                if (!cfg.MODEL_FLASH) {
                    appendMessage('error-msg', '❌ 未配置 MODEL_FLASH，无法识图，请检查 config.conf');
                    return;
                }
                currentModel = cfg.MODEL_FLASH;
                effort = flashEffort;
            } else {
                if (currentMode === 'auto') {
                    let routePlaceholders = [];
                    if (currentAttachments.some(a => a.type === 'image')) routePlaceholders.push('[图片]');
                    if (currentAttachments.some(a => a.type === 'text')) {
                        let officeExts = ['docx', 'pptx', 'xlsx', 'pdf', 'rtf', 'odt', 'odp', 'ods'];
                        currentAttachments.filter(a => a.type === 'text').forEach(a => {
                            let ext = a.name.split('.').pop().toLowerCase();
                            if (officeExts.includes(ext)) {
                                routePlaceholders.push(`[${ext.toUpperCase()}文件]`);
                            } else {
                                routePlaceholders.push('[文本文件]');
                            }
                        });
                    }
                    let routeInput = (routePlaceholders.length > 0 ? routePlaceholders.join(' ') + ' ' : '') + text;
                    
                    const taskType = await routeTask(routeInput);
                    if (taskType.startsWith('PRO_')) {
                        if (!cfg.MODEL_PRO) { 
                            appendMessage('error-msg', '⚠️ 自动选择推理但未配置 MODEL_PRO，回退至 Flash'); 
                            currentModel = cfg.MODEL_FLASH;
                            effort = 'high';
                        } else {
                            currentModel = cfg.MODEL_PRO;
                            effort = taskType.replace('PRO_', '').toLowerCase();
                        }
                    } else {
                        currentModel = cfg.MODEL_FLASH;
                        effort = taskType.replace('FLASH_', '').toLowerCase();
                    }
                } else if (currentMode === 'pro') {
                    if (!cfg.MODEL_PRO) { appendMessage('error-msg', '❌ 未配置 MODEL_PRO，请检查 config.conf'); return; }
                    currentModel = cfg.MODEL_PRO; 
                    effort = proEffort;
                } else {
                    currentModel = cfg.MODEL_FLASH;
                    effort = flashEffort;
                }
            }

            userInput.value = ''; 
            userInput.style.height = 'auto';
            
            let msgObj = { 
                id: getNextId(), role: 'user', content: text, timestamp: Date.now()
            };
            
            if (textFileNames.length > 0) {
                msgObj.fileNames = textFileNames;
                msgObj.fileContents = textFileContents;
            }
            if (hasImages) {
                msgObj.images = currentAttachments.filter(a => a.type === 'image').map(a => a.low);
            }
            
            chatHistory.push(msgObj);
            
            currentAttachments = [];
            renderAttachmentPreview();
            
            renderedCount = 50;
            renderMessageWithTags(msgObj, 'user');
            scrollToBottom();

            const ctx = getContextPayload();
            
            if (hasImages) {
                let lastUserMsg = ctx[ctx.length - 2];
                if (lastUserMsg && lastUserMsg.role === 'user') {
                    let contentArr = [{ type: "text", text: lastUserMsg.content }];
                    highImages.forEach(imgBase64 => {
                        contentArr.push({ type: "image_url", image_url: { url: imgBase64 } });
                    });
                    lastUserMsg.content = contentArr;
                }
            }

            let modelTag = currentModel === cfg.MODEL_PRO ? 'Pro' : 'Flash';
            if (hasImages) modelTag = 'Flash (Vision)';
            if (effort !== 'none') modelTag += ` (${effort})`;
            
            let streamWrapper = document.createElement('div');
            streamWrapper.className = 'msg-wrapper bot';
            streamWrapper.id = 'streaming-bubble';
            let header = buildHeader('bot', modelTag, Date.now());
            if (header) streamWrapper.appendChild(header);
            let div = document.createElement('div');
            div.className = 'message bot';
            streamWrapper.appendChild(div);
            chatContainer.appendChild(streamWrapper);
            scrollToBottom();

            await processStreamAndFollowUp(ctx, currentModel, effort, streamWrapper);

        } catch (error) {
            const sb = document.getElementById('streaming-bubble');
            if (sb) sb.remove();
            appendMessage('error-msg', `❌ 运行异常: ${error.message}`);
        } finally {
            isGenerating = false;
            currentAbortController = null;
            
            const elapsed = Date.now() - clickTime;
            const remainingCd = Math.max(0, 1000 - elapsed);
            
            if (remainingCd > 0) {
                setTimeout(() => { resetSendBtnState(); }, remainingCd);
            } else {
                resetSendBtnState();
            }
        }
    }

    updateMenuChecks();
    loadConfig();
    initData();
</script>
</body>
</html>
